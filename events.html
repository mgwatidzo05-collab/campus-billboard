<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Events - NUST Campus Billboard</title>
    <!-- Bootstrap 5 CSS Framework CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h2>NUST <span>Events</span></h2></div>
        <div class="menu-container">
            <button class="menu-btn" id="menu-toggle" aria-expanded="false" onclick="toggleMenu(event)">Menu ☰</button>
            <ul class="dropdown-menu" id="dropdown-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About & Contact</a></li>
                <li><a href="events.html" class="active">Browse Events</a></li>
                <li><a href="login.html">Student Portal</a></li>
                <li><a href="admin.html">Admin Dashboard</a></li>
            </ul>
        </div>
    </header>

    <main class="container my-4">
        <h2 class="mb-4">NUST Campus Activities</h2>
        
        <!-- Unauthenticated message fallback container -->
        <div id="auth-warning" class="alert alert-warning text-center p-4 shadow-sm" style="display: none;">
            <h4>🔒 Authentication Required</h4>
            <p class="mb-3">You must sign in with your official NUST student account to browse active campus events.</p>
            <a href="login.html" class="btn btn-primary fw-bold">Go to Student Portal</a>
        </div>

        <div id="events-container" class="event-grid">
            <!-- Dynamically loaded via script.js -->
        </div>
    </main>

    <footer class="bg-white text-center py-4 border-top mt-5">
        <p class="text-muted mb-0">&copy; 2026 NUST Campus Event Billboard.</p>
    </footer>

    <script>
        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            const btn = document.getElementById('menu-toggle');
            const isOpen = menu.classList.toggle('show');
            btn.setAttribute('aria-expanded', isOpen);
        }
        window.onclick = function() {
            const menu = document.getElementById('dropdown-menu');
            const btn = document.getElementById('menu-toggle');
            if (menu) {
                menu.classList.remove('show');
                if(btn) btn.setAttribute('aria-expanded', 'false');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
    <script src="script.js"></script>
</body>
</html>
