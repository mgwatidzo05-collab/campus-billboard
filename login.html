<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - NUST Campus Billboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h2>NUST <span>Events</span></h2></div>
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu(event)">Menu ☰</button>
            <ul class="dropdown-menu" id="dropdown-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Browse Events</a></li>
                <li><a href="login.html" class="active">Student Portal</a></li>
                <li><a href="admin.html">Admin Dashboard</a></li>
            </ul>
        </div>
    </header>

    <main class="container" style="max-width: 500px; margin-top: 3rem;">
        <!-- Sign In Form -->
        <section class="form-section" id="signin-section">
            <h2>Student Sign In</h2>
            <form id="signin-form" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signin-email" required placeholder="student@nust.ac.zw">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signin-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <p style="margin-top: 1rem; text-align: center;">
                    Don't have an account? <a href="#" id="show-signup" style="color: var(--primary);">Register here</a>
                </p>
            </form>
        </section>

        <!-- Sign Up Form (Hidden by default) -->
        <section class="form-section" id="signup-section" style="display: none;">
            <h2>Student Registration</h2>
            <form id="signup-form" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Institutional Email</label>
                    <input type="email" id="signup-email" required placeholder="student@nust.ac.zw">
                </div>
                <div class="form-group">
                    <label>Password (Min. 8 chars)</label>
                    <input type="password" id="signup-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
                <p style="margin-top: 1rem; text-align: center;">
                    Already registered? <a href="#" id="show-signin" style="color: var(--primary);">Sign in here</a>
                </p>
            </form>
        </section>

        <!-- Active Session Profile View -->
        <section class="form-section" id="user-profile" style="display: none; text-align: center;">
            <h2>Welcome, <span id="profile-name">Student</span>!</h2>
            <p style="margin: 1rem 0;">You have an active secure session. You can now browse events.</p>
            <a href="events.html" class="btn-primary" style="display: inline-block; margin-bottom: 1rem;">Browse Events Now</a>
            <br>
            <button id="logout-btn" class="delete-btn" style="padding: 0.75rem 1.5rem;">Sign Out</button>
        </section>
    </main>

    <script>
        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('show');
        }
        window.onclick = function() {
            const menu = document.getElementById('dropdown-menu');
            if (menu) menu.classList.remove('show');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
    <script src="script.js"></script>
</body>
</html>
